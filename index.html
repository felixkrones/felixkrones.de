<script>
"use strict";
/* =====================================================================
   0. CANVAS
   ===================================================================== */
const W = 640, H = 320;
const cv = document.getElementById('c');
/* the game draws at 640x320; present() copies each frame to the page canvas enlarged by a whole number,
   and the browser does only the last small step, so every pixel has the same size on any screen */
const LO = document.createElement('canvas'); LO.width = W; LO.height = H;
let ctx = LO.getContext('2d', { alpha:false });   // let: scenery is sometimes drawn into an offscreen canvas
ctx.imageSmoothingEnabled = false;
const cvCtx = cv.getContext('2d', { alpha:false });
let CVK = 0;
function fitCanvas(){
  const k = Math.min(6, Math.max(1, Math.ceil(cv.getBoundingClientRect().width * (window.devicePixelRatio || 1) / W)));
  if (k !== CVK){ CVK = k; cv.width = W*k; cv.height = H*k; }
}
function present(){ if (!CVK) fitCanvas(); cvCtx.imageSmoothingEnabled = false; cvCtx.drawImage(LO, 0, 0, W*CVK, H*CVK); }
addEventListener('resize', fitCanvas); addEventListener('orientationchange', () => setTimeout(fitCanvas, 200));
let SK=1, SOX=0, SOY=0;           // optional scale around an anchor, snapped to whole pixels
const r = (x,y,w,h,col) => {
  ctx.fillStyle = col;
  if (SK===1){ ctx.fillRect(x|0, y|0, Math.max(1,w|0), Math.max(1,h|0)); return; }
  const x0 = Math.round(SOX + (x-SOX)*SK), y0 = Math.round(SOY + (y-SOY)*SK);
  const x1 = Math.round(SOX + (x+w-SOX)*SK), y1 = Math.round(SOY + (y+h-SOY)*SK);
  ctx.fillRect(x0, y0, Math.max(1,x1-x0), Math.max(1,y1-y0));
};
function scaled(ox, oy, k, fn){ const a=SK,b=SOX,c=SOY; SK=k; SOX=ox; SOY=oy; fn(); SK=a; SOX=b; SOY=c; }
const UK = 1.6;                    // world art unit: the painters were drawn for a 400x200 view
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const lerp = (a,b,t) => a+(b-a)*t;

/* =====================================================================
   1. PALETTE + SPRITES  (all hand-drawn pixel grids, 1 char = 1 px)
   ===================================================================== */
const PAL = {
  '.':null,
  K:'#2a2019', k:'#3f3026',            // hair dark / mid
  S:'#e8b48a', D:'#cf9670',            // skin / shadow
  E:'#14100e', W:'#f4f2ee', M:'#c4785f',
  T:'#2b3552', t:'#1f2740',            // tee / shade
  P:'#232c44', p:'#1a2134',            // trousers / shade
  O:'#2b2b30', o:'#e8e6e1',            // shoe / sole
  N:'#15120f', n:'#2c313a', U:'#39466b', F:'#f3c9a5',   // outline / dark grey / tee highlight / skin light
  Y:'#f2c14e', y:'#c99423',            // gold / dark gold
  R:'#c8493f', G:'#4f8f5a', B:'#3d6fb4', b:'#8a5a33', a:'#5c3a1f',
  g:'#9aa2ae', h:'#c6ccd2', w:'#ffffff', q:'#d8869f', u:'#6f4a8e', c:'#7fc0dd',
  L:'#a9d6e5', l:'#e0f0f6', z:'#5a8a3c', v:'#e07b39', x:'#8b1e2d', i:'#009246', j:'#ce2b37',
  e:'#2f3d63', f:'#1f2945',            // Luftwaffe beret
  Q:'#3a4d6e', Z:'#2a3852',            // quarter zip / shade
  A:'#c9b48c', X:'#a8936c',            // chinos / shade
  C:'#eef2f5', H:'#a8743f', J:'#23417a', V:'#fbe3a0'   // icon highlights
};
/* Flecktarn camouflage for the uniform: a fixed pattern per pixel */
const CAMO = ['#6b7a4c', '#6b7a4c', '#4a5634', '#7e6443', '#2c2f24', '#8d9863'];
const camo = (x, y) => CAMO[Math.floor(hash(Math.floor(x/2)*31 + Math.floor(y/2)*97 + 5) * 6) % 6];
/* draw a sprite, recolouring some letters through fn(x, y, letter) */
function drawRemap(grid, ox, oy, letters, fn){
  for (let y=0; y<grid.length; y++){
    const row = grid[y];
    for (let x=0; x<row.length; x++){
      const ch = row[x];
      const c = letters.includes(ch) ? fn(x, y, ch) : PAL[ch];
      if (c) r(ox + x, oy + y, 1, 1, c);
    }
  }
}

function draw(grid, ox, oy, flip){
  for (let y=0; y<grid.length; y++){
    const row = grid[y];
    for (let x=0; x<row.length; x++){
      const c = PAL[row[x]];
      if (!c) continue;
      r(flip ? ox + (row.length-1-x) : ox + x, oy+y, 1, 1, c);
    }
  }
}

/* ---- Felix: 32 wide x 58 tall, outlined and shaded. Origin = top-left; feet on row 57. ---- */
const HEAD = [

  '.........NKkkKNNKKkKKKKN........',
  '........NKKKkkKKKKKKKKKN........',
  '.......NKKKkkKKKKKKKKKKKN.......',

const TORSO = [

  '.......NNNTTTTTTTTTTTTTNNN......',
  '.....NNTTTTTTTUUTTTTTTTTTTNN....',
  '....NTTTTTTTTTUUTTTTTTTTTTTTN...',

  '...NTTTtTTTTTTUUTTTTTTTTTtTTTN..',

  '...NTTTtNTTTTTUUTTTTTTTTNtTTTN..',
  '...NtttNNTTTTTTTTTTTTTTTNNtttN..',
  '...NSSSN.NTTTTTTTTTTTTTN.NSSSN..',

  '...NSSSN.NTTTTTTTTTTTTTN.NSSSN..',

/* ---- after the secret workout: broader shoulders and bigger arms, the same body width so the legs still fit ---- */
const TORSO_BUFF = [
  '..........NNTTTTTTTTTNN.........',
  '......NNNNTTTTTTTTTTTTTNNNN.....',
  '...NNTTTTTTTTTUUTTTTTTTTTTTTNN..',
  '..NTTTTTTTTTTTUUTTTTTTTTTTTTTTN.',

  '.NtttttN.NTTTTUUTTTTTTTN.NtttttN',
  '.NSSSSSN.NTTTTTTTTTTTTTN.NSSSSSN',
  '.NSSSSSN.NTTTTTTTTTTTTTN.NSSSSSN',

  '..NNNNN..NNNNNNNNNNNNNNN..NNNNN.'
];
/* flex pose right after the workout: both arms up, drawn 6 rows higher than the torso (origin row 16) */
const TORSO_FLEX = [
  '..NNNNN...................NNNNN.',
  '.NSSSSSN.................NSSSSSN',
  '.NSDSDSN.................NSDSDSN',
  '.NSSSSSN.................NSSSSSN',
  '.NDSSSSN.................NSSSSDN',
  '.NDSSSSN.................NSSSSDN',
  '.NDSSSSN..NNTTTTTTTTTNN..NSSSSDN',

function spread(g, amt){
  return g.map((row,i)=>{
    const s = Math.min(amt, Math.floor(i/4));
    if (!s) return row;
    const L = row.slice(0,16), Rr = row.slice(16);
    return (L.slice(s) + '.'.repeat(s)) + ('.'.repeat(s) + Rr.slice(0, Rr.length-s));
  });
}

function drawIcon(grid, x, y, s=1){
  if (s===1) return draw(grid, x, y);
  ctx.save(); ctx.translate(Math.round(x), Math.round(y)); ctx.scale(s, s); draw(grid, 0, 0); ctx.restore();
}
const tw = (s, sp=1) => s.length*(5+sp)-sp;
function text(s, x, y, col, sp=1){
  s = String(s).toUpperCase(); let cx = x|0;
  for (const ch of s){
    const g = FONT[ch] || FONT['?'];
    for (let ry=0; ry<7; ry++) for (let rx=0; rx<5; rx++) if (g[ry][rx]==='#') r(cx+rx, y+ry, 1, 1, col);
    cx += 5+sp;
  }
}
const textC = (s, cx, y, col, sp=1) => text(s, Math.round(cx - tw(s,sp)/2), y, col, sp);
function textShadow(s, x, y, col, sp=1){ text(s, x+1, y+1, 'rgba(0,0,0,.55)', sp); text(s, x, y, col, sp); }
const textCS = (s, cx, y, col, sp=1) => textShadow(s, Math.round(cx - tw(s,sp)/2), y, col, sp);
function text2(s, x, y, col, sp=1){ ctx.save(); ctx.translate(Math.round(x), Math.round(y)); ctx.scale(2,2); text(s, 0, 0, col, sp); ctx.restore(); }
const tw2 = (s, sp=1) => tw(s,sp)*2;
function textC2(s, cx, y, col, sp=1){ text2(s, Math.round(cx - tw2(s,sp)/2), y, col, sp); }

function popSparks(x,y,col,n=10,sp=140){
  for (let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, v = sp*(0.4+Math.random()*0.8);
    S.sparks.push({ x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v-40, life:0.55+Math.random()*0.35, col });
  }
}

function leadFor(boxY){
  const h = SH(), top0 = boxY + 32 + h, top1 = boxY + h;
  const tOf = hh => { const d = JUMPV*JUMPV - 2*GRAV*hh; return d < 0 ? null : (-JUMPV - Math.sqrt(d))/GRAV; };
  const t1 = tOf(GROUND - top0); if (t1 === null) return null;
  const t2 = tOf(GROUND - top1);
  const tm = (t1 + (t2 === null ? -JUMPV/GRAV : t2)) / 2;
  return SPD*tm + 18;
}

/* =====================================================================
   5. STEP
   ===================================================================== */
function startGame(auto){
  if (S.started){ if (!auto) S.manual = true; return; }
  S.started = true; S.startT = S.t; S.auto = auto; S.manual = !auto;
  S.intro = { t:0, dropped:false, done:false };
}

function step(dt){
  S.t += dt;
  if (!S.started) return;

  /* the stork brings him */
  if (S.intro && !S.intro.done){
    const it = S.intro; it.t += dt;
    if (it.t > 2.3 && !it.dropped){ it.dropped = true; }
    if (it.t > 2.9 && !S.visible){
      S.visible = true; S.kid = 2;
      popSparks(S.x, S.y - 20, '#ffffff', 16, 90); sfx('star');
      const born = BOXES[0]; born.hit = true; onHit(born);
    }
    if (it.t > 3.6) it.done = true;
    for (const p of S.sparks){ p.life -= dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 260*dt; }
    S.sparks = S.sparks.filter(p=>p.life>0);
    tickFly(dt); tickTimers(dt);
    return;
  }

  const seg = segAt(S.x);
  if (seg !== S.lastSeg){
    if (seg.name || seg.route){ S.plate = seg; S.plateT = 2.8; }
    S.lastSeg = seg; onSegment(seg);
  }
  const wantFly = seg.kind === 'flight';
  S.flying = wantFly;
  S.flyBlend = clamp(S.flyBlend + (wantFly ? dt*2.2 : -dt*2.2), 0, 1);

  /* horizontal */
  let fast = (keys.ShiftLeft || keys.ShiftRight) ? (S.partner ? 2.8 : 1.9) + (S.buff ? 0.6 : 0) : 1;   // together even faster, and after the secret workout faster still
  if (!S.manual && !ROBOT.got && Math.abs(ROBOT.x - S.x) < 600) fast = 1;         // playing by itself: walk when the robot is near, so the jump lands
  const speed = wantFly ? (seg.id==='f_mck' ? FLYSPD_MCK : FLYSPD) * fast : (fast > 1 ? RUNSPD : SPD) * fast;   // Shift also speeds up the plane
  S.fast = fast;
  const END_X = WORLD_END - 280;
  if (S.kb){
    /* pushed back by the robot: no control for a moment */
    S.kb.t -= dt; S.x += S.kb.vx*dt; if (S.kb.t <= 0) S.kb = null;
  } else if (GYM.phase){
    stepGym(dt);
  } else if (S.ended){
    /* the end: both stroll to the right, into the bright light */
    S.x += 92*dt; S.facing = 1;
  } else if (S.manual){
    /* manual: on the ground and in the plane, left/right move back and forth, Shift is faster */
    let dir = 0;
    if (keys.ArrowRight || keys.KeyD) dir = 1;
    if (keys.ArrowLeft) dir = -1;
    S.x += dir*speed*dt;
    if (dir) S.facing = dir;
    if ((keys.ArrowUp || keys.KeyW) && S.onGround && S.flyBlend===0){ S.vy = S.buff ? JUMPV*1.15 : JUMPV; S.onGround=false; sfx('jump'); }   // a little higher after the workout
  } else {
    if (!S.ended) S.x += speed*dt;
    S.facing = 1;
    if (!wantFly && S.onGround && !S.ended && S.flyBlend===0){
      for (const b of BOXES){
        if (b.hit || b.virtual) continue;
        const d = b.x + 16 - S.x, lead = leadFor(b.y);
        if (lead !== null && d > 0 && d <= lead){ S.vy = JUMPV; S.onGround = false; sfx('jump'); break; }
      }
      if (S.onGround) robotAutoJump(speed, END_X);
    }
  }
  /* the end: only with all achievements; otherwise a warning and the way is blocked */
  const complete = S.stars >= TOTAL();
  if (!S.ended && S.x >= END_X){
    if (complete){ S.ended = true; sfx('flag'); }
    else { if (!S.warn) sfx('jump'); S.x = END_X; }
  }
  S.warn = !S.ended && !complete && S.x > END_X - 60;
  S.x = clamp(S.x, 60, S.ended ? WORLD_END + 90 : END_X);
  /* McKinsey strip by life period: McKinsey box to DPhil start, QuantumBlack return to Waterland */
  S.mck = MCK_PERIODS.some(([a, b]) => S.x >= a && S.x < b);

  /* vertical */
  if (S.flyBlend > 0){
    let planeY = FLY_Y + Math.sin(S.t*2.4)*13;
    if (S.manual && wantFly){
      if (keys.ArrowUp || keys.KeyW) S.planeOff = clamp((S.planeOff||0) - 220*dt, -64, 80);
      if (keys.ArrowDown || keys.KeyS) S.planeOff = clamp((S.planeOff||0) + 220*dt, -64, 80);
      planeY += (S.planeOff||0);
    } else S.planeOff = 0;
    const target = wantFly ? planeY : GROUND;
    S.y = lerp(S.y, target, wantFly ? Math.min(1, dt*6) : Math.min(1, dt*5));
    if (!wantFly && S.flyBlend < 0.05){ S.y = GROUND; S.flyBlend = 0; S.onGround = true; S.vy = 0; }
    else S.onGround = false;
  } else {
    S.vy += GRAV*dt;
    S.y += S.vy*dt;
    if (S.y >= GROUND){ S.y = GROUND; S.vy = 0; S.onGround = true; }
  }

  /* boxes: axis-aligned test from below */
  const hw = 12, top = S.y - SH();
  for (const b of BOXES){
    if (b.virtual) continue;
    b.bump = Math.max(0, b.bump - dt*3.2);
    if (b.hit){ b.open = Math.min(1, b.open + dt*3); continue; }
    const ox = (S.x + hw > b.x) && (S.x - hw < b.x + 32);
    const oy = (top < b.y + 32) && (S.y > b.y);
    if (ox && oy && S.vy < 0){
      b.hit = true; b.bump = 1;
      S.y = b.y + 32 + SH(); S.vy = 60;
      onHit(b);
    }
  }
  stepRobot(dt);
  stepBall(dt);

  /* flight stars */
  for (const fl of MCK_FLAGS){
    if (fl.got) continue;
    fl.y = FLY_Y - 44 + Math.sin(fl.k*1.7)*10;
    if (Math.abs(fl.x - S.x) < 40 && S.flyBlend > 0.5){
      fl.got = true; S.flagsGot.push(fl.c); popSparks(fl.x, fl.y, '#ffffff', 8, 70); sfx('wear');
      S.plate = { kind:'country', name:fl.name }; S.plateT = 1.6;
    }
  }
  /* volunteering: collected by walking past */
  for (const h of HELPS){
    if (h.got || S.x < h.x) continue;
    h.got = true; S.stars++; S.btnGlow = 1; refreshPanel(); S.helpPop = { h:{ lines:[h.tag, h.org || h.loc || '', h.year].filter(Boolean) }, t:0 }; sfx('wear');
    popSparks(h.x + 12, GROUND - 40, '#e0708f', 8, 80);
  }
  for (const u of UPGRADES){
    if (!AI.on || u.got || S.x < u.x) continue;
    u.got = true; ROBOT[u.up] = true; S.btnGlow = 1; refreshPanel(); sfx('wear');
    S.helpPop = { h:{ lines:[u.tag, u.desc, u.year] }, t:0, col:'#7fc0dd' };
    popSparks(u.x + 12, GROUND - 40, '#7fc0dd', 8, 80);
  }
  /* the secret club: walking up to its door takes him inside */
  if (GYM.on && !GYM.done && !GYM.phase && S.onGround && S.flyBlend === 0 && !S.kb && S.x >= GYM.doorX && S.x < GYM.doorX + 60){
    GYM.phase = 'in'; GYM.t = 0; S.x = GYM.doorX; S.facing = 1; sfx('wear');
  }
  for (const e of EVENTS){
    if (e.done || S.x < e.x) continue;
    e.done = true; if (e.fx==='mck_on') S.mck = true; if (e.wear) wear(e.wear);
    if (e.lines){ S.helpPop = { h:{ lines:e.lines }, t:0, col:e.col, dur:4.2 }; sfx('wear'); }
  }
  if (S.helpPop && S.bubbles.length){   // the note next to Felix goes where he goes: if it runs into a box bubble, the older of the two fades out
    const hp = S.helpPop, cam = camX(), [px, py, pw, ph] = popRect(hp, cam);
    for (const bb of S.bubbles){
      const [bx, by, bw, bh] = bubbleRect(bb, cam);
      if (!(px < bx+bw && bx < px+pw && py < by+bh && by < py+ph)) continue;
      if (bb.t < hp.t) hp.t = Math.max(hp.t, (hp.dur || 3.3) - 0.3); else bb.t = Math.max(bb.t, BUBBLE_T - 0.25);
    }
  }
  if (S.helpPop && S.helpPop.t > 0.5){   // a note that would cover a box still to be hit makes way
    const hp = S.helpPop, cam = camX(), [px, py, pw, ph] = popRect(hp, cam);
    if (BOXES.some(b => !b.hit && !b.virtual && b.x - cam < px+pw && px < b.x - cam + 32 && py < b.y+32 && b.y < py+ph)) hp.t = Math.max(hp.t, (hp.dur || 3.3) - 0.3);
  }
  if (S.helpPop){ S.helpPop.t += dt; if (S.helpPop.t > (S.helpPop.dur || 3.3)) S.helpPop = null; }
  if (!S.partner && GF.on && S.x > PARTNER_X && S.flyBlend === 0){ S.partner = { x:S.x+140, t:0 }; }

  tickTimers(dt);
  tickFly(dt);

  for (const p of S.sparks){ p.life -= dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 420*dt; }
  S.sparks = S.sparks.filter(p=>p.life>0);
  for (const p of S.pops){ p.t += dt; }
  S.pops = S.pops.filter(p=>p.t<1.1);

  if (S.partner){
    S.partner.t += dt;
    if (S.flyBlend > 0.3) S.partner.x = S.x - 30*S.facing;                    // on the plane she sits right behind him
    else {                                                                     // she walks close behind him in either direction, a little lag even when running
      const want = S.x - (GYM.phase ? 70 : 34)*S.facing;                  // she waits a step away from the club door
      S.partner.x += (want - S.partner.x) * Math.min(1, dt*12);
      S.partner.x = clamp(S.partner.x, want - 22, want + 22);
    }
  }
  if (S.ended){
    S.endT += dt;
    S.outlook = clamp((S.endT-0.4)/1.4, 0, 1);
    if (S.endT > 7.5 && !S.panelShown){ S.panelShown = true; openPanel(true); }
  }
}

function tickTimers(dt){
  /* the caption stays until he has walked on */
  if (S.plateT > 0) S.plateT -= dt;
  if (S.flash > 0) S.flash -= dt*2.2;
  S.mckT = clamp(S.mckT + (S.mck ? dt*2 : -dt*2), 0, 1);
  if (S.btnGlow > 0) S.btnGlow -= dt*1.6;
}
function tickFly(dt){
  for (const f of S.fly){
    f.t += dt;
    if (f.phase===0){ f.y -= 110*dt; if (f.t > (f.fast ? 0.2 : 0.4)){ f.phase=1; f.t=0; } }
    else if (f.phase===1){ const k = Math.min(1, dt*(f.fast ? 9 : 5)); f.x = lerp(f.x, S.x + 40, k); f.y = lerp(f.y, S.y - SH() - 50 + Math.sin(f.t*6)*3, k); if (f.t > (f.fast ? 0.25 : 1.2)){ f.phase=2; f.t=0; f.sx=f.x; f.sy=f.y; } }
    else if (f.phase===2){
      const k = Math.min(1, f.t/(f.fast ? 0.25 : 0.5)), e = 1-Math.pow(1-k,3);
      const [tx,ty] = f.target();
      f.x = lerp(f.sx, tx, e); f.y = lerp(f.sy, ty, e); f.sc = lerp(3, 1, e);
      if (k>=1){ f.done = true; f.arrive(); }
    }
  }
  S.fly = S.fly.filter(f=>!f.done);
  for (const bb of S.bubbles) bb.t += dt;
  S.bubbles = S.bubbles.filter(bb => bb.t < BUBBLE_T);
}

function onHit(b){
  if (b.k==='station') S.worn.neck = null;           // a degree medal is worn until the next station starts
  popSparks(b.x+16, b.y, BOXSTYLE[b.t].a, 14, 140);
  sfx('hit');
  S.stars++;
  for (const bb of S.bubbles) bb.t = Math.max(bb.t, BUBBLE_T - 0.25);   // an older bubble makes way and fades out
  S.bubbles.push({ lines:[[b.tag, '#f4f2ee'], [b.org || b.loc || '', '#b9b2a4'], [b.year, '#f2c14e']].filter(l => l[0]), x:b.x+16, y:b.y-10, t:0 });
  /* items you wear fly into Felix quickly and change the outfit when they arrive; others fly to the star button */
  const item = { icon:b.icon, x:b.x-2, y:b.y-10, t:0, phase:0, sc:3, fast:!!b.wear,
    target: () => b.wear ? [S.x-18, S.y - SH() + 14] : [W - 40 + camX(), 6],
    arrive: () => {
      S.btnGlow = 1;
      if (b.wear){ wear(b.wear); popSparks(S.x, S.y - 32, '#ffffff', 10, 90); sfx('wear'); }
      if (b.fx==='grow1') S.kid = 1;
      if (b.fx==='grow2') S.kid = 0;
      refreshPanel();
    } };
  S.fly.push(item);
  refreshPanel();
  if (b.fx==='mck_on')  S.mck = true;
  if (b.fx==='mck_off') S.mck = false;
}
function camX(){ return clamp(S.x - 200, 0, WORLD_END - W); }
/* where the text boxes sit on screen: [x, y, w, h] */
function bubbleRect(bb, cam){
  const w = Math.max(...bb.lines.map(l=>tw2(l[0])))+20, hh = 8 + bb.lines.length*20;
  return [clamp(bb.x - cam - w/2, 6, W-w-6), Math.max(4, bb.y - 16 - hh - Math.min(bb.t, 0.4)*40), w, hh];
}
function popRect(hp, cam){
  const lines = hp.h.lines, w = Math.max(...lines.map(l=>tw2(l))) + 20, hh = 8 + lines.length*20, rise = 6 - Math.min(hp.t, 0.3)*20;
  if (hp.above) return [clamp(S.x - cam - w/2, 6, W-w-6), GROUND - SH() - hh - 10 + rise, w, hh];   // over his head, so the robot in front stays in sight
  const x = clamp(S.x - cam + 44, 6, W-w-6);
  /* on foot the note stands on the ground next to him, below the boxes, and stays put when he jumps; in the plane it flies along */
  const y = S.flyBlend > 0 ? S.y - SH() - 4 - (lines.length-2)*20 + rise - 6 : GROUND - 4 - hh + rise;
  return [x, y, w, hh];
}

/* ---- the robot: idle at home, charges when Felix comes near, pushes him back on contact, mastered when he lands on it ---- */
const ROBOT_TLAND = (() => { const apex = JUMPV*JUMPV/(2*GRAV); return -JUMPV/GRAV + Math.sqrt(2*Math.max(0, apex - ROBOT_H)/GRAV); })();   // s from take-off to landing on its head
function robotAutoJump(speed, endX){
  const rb = ROBOT; if (rb.got || Math.abs(rb.x - S.x) > 600) return;
  const felixAt = Math.min(S.x + speed*ROBOT_TLAND, endX), robotAt = rb.x + rb.vx*ROBOT_TLAND, gap = robotAt - felixAt;
  const closing = rb.vx - (felixAt > S.x + 1 ? speed : 0) < 0;      // is the gap shrinking or growing?
  if (gap >= (closing ? -16 : -7) && gap <= (closing ? 7 : 16)){ S.vy = JUMPV; S.onGround = false; sfx('jump'); }
}
/* ---- the secret workout: inside for a moment (clanks, sweat), then out with a hop, a flex and bigger arms ---- */
function stepGym(dt){
  const g = GYM, t0 = g.t; g.t += dt;
  if (g.phase === 'in'){
    if (Math.floor(g.t/0.6) !== Math.floor(t0/0.6) && g.t < g.tIn){ sfx('clank'); popSparks(g.doorX + (Math.random()-0.5)*40, GROUND - 70, '#9fc3ea', 4, 60); }
    if (g.t >= g.tIn){
      g.phase = 'out'; g.t = 0; S.buff = true; g.done = true;
      S.vy = -250; S.onGround = false; sfx('star');
      popSparks(S.x, GROUND - 40, '#ffffff', 14, 130); popSparks(S.x, GROUND - 40, g.col, 10, 110);
      S.helpPop = { h:{ lines:[g.tag, g.org.toUpperCase() + ', ' + g.loc.toUpperCase(), g.year] }, t:0, col:g.col, dur:4.2 };
      S.btnGlow = 1; refreshPanel();
    }
  } else if (g.phase === 'out'){
    /* the hop, then the flex on the ground; movement returns afterwards */
    if (g.t >= g.tHop + g.tFlex && S.onGround) g.phase = null;
  }
}
function stepBall(dt){
  const b = BALL, R = 5;
  if (b.goalT > 0) b.goalT -= dt;
  if (b.state === 'idle'){
    b.x = b.home + Math.sin(S.t*1.6)*8*UK; b.h = Math.abs(Math.sin(S.t*4.8))*10*UK;   // bouncing on the spot
  } else {
    const x0 = b.x;
    b.vh -= 900*dt; b.x += b.vx*dt; b.h += b.vh*dt;
    if (b.h <= 0){ b.h = 0; b.vh = b.vh < -80 ? -b.vh*0.45 : 0; b.vx *= Math.pow(0.2, dt); }   // bounces, then rolls out
    /* the goal is open to the left, the net is at the back */
    if (!b.scored && x0 < b.post && b.x >= b.post){
      if (b.h < b.barH - R){ b.scored = true; b.goalT = 1.8; sfx('flag'); popSparks(b.post + 20, GROUND - 30, '#f2c14e', 14, 120); popSparks(b.post + 20, GROUND - 30, '#ffffff', 8, 90); }
      else if (b.h < b.barH + R){ b.x = b.post - 1; b.vx = -Math.abs(b.vx)*0.5; }   // off the crossbar
    }
    if (x0 >= b.post - 2 && x0 <= b.back && b.x > b.back - 8 - R && b.h < b.barH){ b.x = b.back - 8 - R; b.vx = -Math.abs(b.vx)*0.15; }   // caught by the net
    if (!b.scored && x0 >= b.back && b.x < b.back && b.h < b.barH){ b.x = b.back; b.vx = Math.abs(b.vx)*0.3; }   // from behind the net stops it
    b.rest = Math.abs(b.vx) < 8 && b.h === 0 && b.vh === 0 ? b.rest + dt : 0;
    if (b.rest > (b.scored ? 1.6 : 2.5) || Math.abs(b.x - b.home) > W){ resetBall(); popSparks(b.home, GROUND - 10, '#ffffff', 6, 60); }   // back on the spot for the next shot
  }
  /* Felix walks or runs into it: a shot in the direction he is going */
  if ((b.state === 'idle' || (!b.scored && b.h < 6 && Math.abs(b.vx) < 60)) && S.visible && S.flyBlend === 0 && !GYM.phase){
    const dx = b.x - S.x;
    if (Math.abs(dx) < 14 && GROUND - b.h - 2*R < S.y && GROUND - b.h > S.y - SH()){
      const dir = dx ? Math.sign(dx) : S.facing, tt = (b.post - b.x)/300;   // towards the goal: aimed just under the crossbar's middle
      const vh = dir > 0 && tt > 0.1 ? clamp((b.barH*0.45 - b.h + 450*tt*tt)/tt, 60, 320) : 220;
      Object.assign(b, { state:'kicked', vx:dir*300, vh, scored:false, rest:0 }); sfx('hit');
    }
  }
}
function stepRobot(dt){
  const rb = ROBOT; rb.t += dt; rb.flash = Math.max(0, rb.flash - dt); rb.squash = Math.max(0, rb.squash - dt*2.8);
  if (rb.got){
    /* mastered: it follows him like a pet (behind the partner once she is there); on the plane it sits at the front */
    const x0 = rb.x;
    if (S.flyBlend > 0.3) rb.x = S.x + 30*S.facing;
    else { const want = S.x - ((S.partner ? 74 : 40) + (GYM.phase ? 36 : 0))*S.facing; rb.x += (want - rb.x)*Math.min(1, dt*8); rb.x = clamp(rb.x, want - 30, want + 30); }
    rb.vx = (rb.x - x0)/Math.max(dt, 1e-4); rb.face = S.facing;
    return;
  }
  const d = S.x - rb.x, dir = d < 0 ? -1 : 1, near = Math.abs(d) < rb.hunt;
  if (rb.state === 'retreat'){
    /* after a bump it backs away from Felix for a moment (but not further than 200 px from home), then hunts again */
    rb.wait -= dt; rb.vx = Math.abs(rb.x - dir*rb.walk*dt - rb.home) < 200 ? -dir*rb.walk : 0; rb.face = dir;
    if (rb.wait <= 0) rb.state = 'idle';
  } else if (near){ rb.state = 'charge'; rb.vx = dir*rb.charge; rb.face = dir; }
  else if (rb.state !== 'charge' || Math.abs(d) > rb.hunt + 140){
    rb.state = 'idle'; rb.vx = Math.abs(rb.home - rb.x) > 3 ? Math.sign(rb.home - rb.x)*rb.walk : 0; rb.face = rb.vx ? Math.sign(rb.vx) : dir;
  }
  rb.x += rb.vx*dt;
  /* contact */
  const rTop = GROUND - ROBOT_H;
  if (S.flyBlend === 0 && Math.abs(S.x - rb.x) < 22){
    if (S.vy > 0 && S.y <= rTop + 18 && S.y >= rTop - 12){
      /* landed on it: mastered */
      rb.got = true; rb.state = 'tamed'; rb.vx = 0; rb.squash = 1; rb.tamedAt = S.t; rb.face = S.facing;
      S.y = rTop; S.vy = JUMPV*0.55; S.onGround = false;
      S.stars++; S.btnGlow = 1; refreshPanel(); sfx('star');
      popSparks(rb.x, rTop, '#7fc0dd', 14, 120);
      S.helpPop = { h:{ lines:[rb.tag, 'AI EXPERT', rb.year] }, t:0, col:'#7fc0dd', dur:3.5 };
      S.fly.push({ icon:rb.icon, x:rb.x - 18, y:rTop - 34, t:0, phase:0, sc:3, fast:false, target: () => [W - 40 + camX(), 6], arrive: () => { S.btnGlow = 1; refreshPanel(); } });
    } else if (!S.kb && S.y > rTop + 18){
      /* walked into it: pushed back, the robot backs off for a moment */
      S.kb = { t:0.45, vx:dir*300 }; if (S.onGround){ S.vy = -190; S.onGround = false; }
      rb.flash = 0.5; rb.state = 'retreat'; rb.wait = 1.6; rb.bumps++; sfx('buzz');
      S.helpPop = { h:{ lines:['BEEP', 'JUMP ON IT'] }, t:0, col:'#e8746b', dur:2, above:true };
    }
  }
}

<script>
/* =====================================================================
   6. BACKGROUND PAINTERS
   ===================================================================== */
const tri = (x, yTop, h, w, col) => { for (let k=0;k<h;k++){ const ww = Math.round(w*(k/h)); r(x - ww/2, yTop + k, Math.max(1,ww), 1, col); } };
const dome = (cx, yBase, rad, col) => { for (let k=0;k<rad;k++){ const ww = Math.round(Math.sqrt(1-((rad-k)/rad)**2)*rad*2); r(cx - ww/2, yBase - rad + k, Math.max(1,ww), 1, col); } };
const hash = i => ((i*2654435761)>>>0) % 1000 / 1000;

const hex2 = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
const mix = (a,b,t) => `rgb(${Math.round(a[0]+(b[0]-a[0])*t)},${Math.round(a[1]+(b[1]-a[1])*t)},${Math.round(a[2]+(b[2]-a[2])*t)})`;
function skyGrad(top, bot){
  const A = hex2(top), B = hex2(bot), N = 9, bh = GROUND / N;
  for (let i=0;i<N;i++){
    const y0 = Math.round(i*bh), y1 = Math.round((i+1)*bh), c = mix(A,B,i/(N-1));
    ctx.fillStyle = c; ctx.fillRect(0, y0, W, y1-y0);
    if (i < N-1){ ctx.fillStyle = mix(A,B,(i+1)/(N-1)); for (let x=(i%2)*2; x<W; x+=4) ctx.fillRect(x, y1-2, 2, 2); for (let x=2-(i%2)*2; x<W; x+=4) ctx.fillRect(x, y1-4, 2, 1); }
  }
}
function disc(cx, cy, rad, col){ for (let k=-rad;k<=rad;k++){ const ww = Math.round(Math.sqrt(rad*rad-k*k)*2); r(cx-ww/2, cy+k, Math.max(1,ww), 1, col); } }
let SUNPOS = { x:380, y:42 };   // where the sun was drawn last: tapping it five times opens all secrets (phones have no keyboard)
function sun(x, y, rad, col, glow){
  SUNPOS = { x, y:y+rad };
  if (glow){ ctx.globalAlpha = .16; disc(x, y+rad, rad*1.9, glow); ctx.globalAlpha = 1; }
  disc(x, y+rad, rad, col);
}
function cloud(x, y, s, col){
  r(x, y, 30*s, 8*s, col); r(x+7*s, y-5*s, 18*s, 6*s, col); r(x+15*s, y-9*s, 11*s, 5*s, col); r(x+24*s, y-4*s, 10*s, 5*s, col);
}
function clouds(cam, p, col, yBase=22, step=240, n=5){
  const first = Math.floor((cam*p)/step)-1;
  for (let i=first;i<first+n;i++){ const x = i*step - cam*p + hash(i)*80; cloud(x, yBase + hash(i+7)*36, 0.7 + hash(i+3)*0.7, col); }
}
function hills(cam, p, col, h, step, seed=0){
  const first = Math.floor((cam*p)/step)-1;
  for (let i=first;i<first+7;i++){
    const x = i*step - cam*p, hh = h + hash(i+seed)*h*0.5;
    for (let k=0;k<hh;k++){ const w = Math.round(step*0.95*Math.sqrt(k/hh)); r(x+step/2-w/2, GROUND-hh+k, w, 1, col); }
  }
}
function mountains(cam, p, col, snow, h, step, base=GROUND, seed=0){
  const first = Math.floor((cam*p)/step)-1;
  for (let i=first;i<first+7;i++){
    const x = i*step - cam*p + step/2, hh = h + hash(i+seed)*h*0.6;
    for (let k=0;k<hh;k++){ const w = Math.round(step*1.1*(k/hh)); r(x-w/2, base-hh+k, w, 1, k < hh*0.3 && snow ? snow : col); }
  }
}
function treeline(cam, p, col, base, step, hgt=26, pine=false){
  const first = Math.floor((cam*p)/step)-1;
  for (let i=first;i<first+Math.ceil(W/step)+3;i++){
    const x = i*step - cam*p, h = hgt*(0.75+hash(i)*0.5);
    if (pine){ r(x+3, base-4, 2, 4, '#3a2f26'); tri(x+4, base-4-h, h, h*0.55, col); }
    else { r(x+4, base-5, 3, 5, '#4a3a2a'); dome(x+5, base-5, h*0.45, col); dome(x+5, base-5-h*0.25, h*0.4, col); }
  }
}
function cityRow(cam, p, cols, base, step=54, minH=30, varH=60, winCol='#f0c06a', seed=0, lit=true){
  const first = Math.floor((cam*p)/step)-1;
  for (let i=first;i<first+Math.ceil(W/step)+3;i++){
    const x = i*step - cam*p, h = minH + hash(i+seed)*varH, w = step-8, col = cols[i%cols.length];
    r(x, base-h, w, h, col);
    r(x, base-h, w, 2, 'rgba(255,255,255,.12)');
    if (lit) for (let yy=6; yy<h-6; yy+=10) for (let xx=5; xx<w-5; xx+=10) if (hash(i*31+yy+xx)>0.35) r(x+xx, base-h+yy, 4, 5, winCol);
  }
}
function groundBand(seg, cam, theme){
  const g = theme.ground;
  r(0, GROUND, W, 6, g.top);
  r(0, GROUND+6, W, 2, 'rgba(0,0,0,.22)');
  r(0, GROUND+8, W, H-GROUND-8, g.body);
  const kind = g.kind;
  for (let i=-8;i<W+8;i+=4){
    const k = Math.floor((cam+i)/4);
    if (kind==='grass'){
      if (hash(k)>0.7){ r(i, GROUND-3, 1, 3, g.top); r(i+2, GROUND-4, 1, 4, '#7fb04f'); r(i+1, GROUND-2, 1, 2, '#9ac66a'); }
      if (hash(k+5)>0.94){ r(i+1, GROUND-5, 1, 3, '#4f7f3a'); r(i, GROUND-7, 3, 2, ['#f2c14e','#f4f2ee','#e07b39','#d8869f'][k%4]); }
      if (hash(k+9)>0.85) r(i, GROUND+10+hash(k)*36, 3, 2, 'rgba(0,0,0,.16)');
      if (hash(k+13)>0.93) r(i, GROUND+8+hash(k+1)*38, 2, 1, 'rgba(255,255,255,.08)');
    } else if (kind==='tarmac'){
      if (k%24 < 8) r(i, GROUND+22, 4, 2, '#d8c25a');
      if (hash(k+9)>0.9) r(i, GROUND+8+hash(k)*30, 2, 1, 'rgba(255,255,255,.08)');
    } else if (kind==='cobble'){
      const row = Math.floor((GROUND+6)/6);
      for (let yy=GROUND+6; yy<H; yy+=6){ const off = ((yy/6)|0)%2 ? 4 : 0; if ((k*4+off)%8===0) r(i, yy, 1, 5, 'rgba(0,0,0,.18)'); }
      if (hash(k+3)>0.92) r(i, GROUND+8+hash(k)*30, 3, 1, 'rgba(255,255,255,.07)');
    } else if (kind==='sand'){
      if (hash(k+2)>0.86) r(i, GROUND+6+hash(k)*34, 2, 1, 'rgba(0,0,0,.12)');
      if (hash(k+4)>0.9) r(i, GROUND-1, 2, 1, '#f0dcae');
    } else if (kind==='snow'){
      if (hash(k)>0.6) r(i, GROUND-1, 3, 1, '#ffffff');
      if (hash(k+9)>0.85) r(i, GROUND+8+hash(k)*30, 2, 2, 'rgba(0,0,0,.14)');
    } else if (kind==='brick'){
      for (let yy=GROUND+6; yy<H; yy+=5){ const off = ((yy/5)|0)%2 ? 6 : 0; if ((k*4+off)%12===0) r(i, yy, 1, 4, 'rgba(0,0,0,.2)'); }
    }
  }
  for (let yy=GROUND+8; yy<H; yy+=8) r(0, yy, W, 1, 'rgba(0,0,0,.06)');
}

/* ---------- landmarks and props (world-anchored: x is a screen x already) ---------- */

function shadow(px, feetY, wdt){
  const lift = clamp((GROUND - feetY)/90, 0, 1), w = Math.round(wdt*(1-lift*0.5)), a = 0.28*(1-lift*0.6);
  r(px - w/2 + 3, GROUND - 1, w - 6, 1, `rgba(0,0,0,${a*0.6})`);
  r(px - w/2, GROUND, w, 2, `rgba(0,0,0,${a})`);
  r(px - w/2 + 3, GROUND + 2, w - 6, 1, `rgba(0,0,0,${a*0.6})`);
}

    drawRemap(torso, 0, ty, 'TtU', (x,y,ch) => ch==='t' ? '#3c4630' : camo(x, y));

    r(11, 22, 4, 2, '#f4f2ee'); r(17, 22, 4, 2, '#f4f2ee'); r(13, 24, 2, 1, '#f4f2ee'); r(17, 24, 2, 1, '#f4f2ee');   // shirt collar

  const ant = rb.got ? '#5ad86a' : (Math.floor(t*4)%2 ? '#e0463c' : '#5a1a14');

function panelBox(x, y, w, h, col='rgba(10,12,17,.8)'){ r(x, y, w, h, col); r(x, y, w, 1, 'rgba(255,255,255,.08)'); }

function render(){
  const cam = camX();
  const seg = segAt(S.x);
  const t = S.t;

  drawScenery(cam, t);
  if (seg.kind!=='flight' && S.flyBlend > 0){ ctx.globalAlpha = S.flyBlend*0.8; scaled(0, GROUND, UK, ()=>clouds(cam/UK, .6, '#ffffff', 96, 170, 7)); ctx.globalAlpha = 1; }

  for (const fl of MCK_FLAGS){
    const sx = fl.x - cam; if (sx<-30||sx>W+30) continue;
    ctx.globalAlpha = fl.got ? 0.4 : 1;
    const y = (fl.y||FLY_Y-44) + Math.sin(t*4+fl.k)*3;
    r(sx-2, y-10, 2, 30, '#d6dde5');                       // little flagpole
    ctx.globalAlpha = .35; r(sx-1, y-9, 30, 20, '#000'); ctx.globalAlpha = 1;
    drawIcon(ICON['flag_'+fl.c], sx, y-10, 2.4);
    ctx.globalAlpha = 1;
  }
  for (const b of BOXES){ if (b.virtual) continue; const sx = b.x - cam; if (sx < -40 || sx > W+40) continue; drawBox(b, sx); }

  if (S.flyBlend > 0){
    ctx.globalAlpha = clamp((S.flyBlend-0.1)*3, 0, 1);   // the plane is there as soon as he leaves the ground, and until just before he lands
    const fx = Math.round(S.x - cam), pxp = fx - 58, pyp = Math.round(S.y) - 12;
    ctx.save(); if (S.facing < 0){ ctx.translate(2*fx, 0); ctx.scale(-1, 1); }   // the plane turns round when flying back
    draw(PLANE, pxp, pyp);
    const spin = Math.floor(t*40)%2; r(pxp+52+spin*4, pyp+25, 3, 4, '#d6dde5');   // engine fan flicker
    ctx.restore();
    ctx.globalAlpha = 1;
  }
  for (const h of HELPS){ const sx = h.x - cam; if (sx > -60 && sx < W+60) drawHelp(h, sx, t); }
  { const sx = Math.round(BALL.x - cam); if (sx > -40 && sx < W+80) drawBall(sx); }
  if (AI.on) for (const u of UPGRADES){ const sx = u.x - cam; if (sx > -60 && sx < W+60) drawUpgrade(u, sx, t); }
  if (GYM.on && !GYM.done){ const sx = GYM.doorX - cam; if (sx > -40 && sx < W+40) drawIcon(ICON.dumbbell16, Math.round(sx) - 16, Math.round(GROUND - 122 + Math.sin(t*3)*3), 2); }   // the secret club is open
  if (S.outlook > 0) brightLight(S.outlook, t);
  if (S.outlook > 0) signpost(WORLD_END - 150 - cam, S.outlook);
  { const sx = ROBOT.x - cam; if (sx > -40 && sx < W + 40){ ctx.globalAlpha = fadeRight(sx); drawRobot(sx, t, ROBOT.got && S.flyBlend > 0 ? S.y : GROUND); ctx.globalAlpha = 1; } }
  if (S.partner){ ctx.globalAlpha = fadeRight(S.partner.x - cam); drawPartner(S.partner.x - cam, S.flyBlend > 0 ? S.y : GROUND); ctx.globalAlpha = 1; }

  /* stork intro */
  if (S.intro && !S.intro.done){
    const it = S.intro, k = Math.min(1, it.t/2.3);
    const sx = -60 + (S.x - cam + 6 + 60)*k, sy = 74 + Math.sin(it.t*3)*5;
    scaled(sx, sy, UK, ()=>stork(sx, sy, it.t, !it.dropped));
    if (it.dropped && !S.visible){ const d = Math.min(1, (it.t-2.3)/0.6), by = sy + 21 + (GROUND - 12 - sy - 21)*d*d; r(S.x-cam-4, by, 19, 11, '#e8d9c2'); r(S.x-cam, by+5, 8, 3, '#e8b48a'); }
  } else if (S.intro && S.intro.done && S.t - S.startT < 6){
    const sx = (S.x - cam + 6) + (S.t - S.startT - 3.6)*190, sy = 64 - (S.t - S.startT - 3.6)*16;
    if (sx < W+60) scaled(sx, sy, UK, ()=>stork(sx, sy, S.t, false));
  }
  if (S.visible && GYM.phase !== 'in'){ ctx.globalAlpha = fadeRight(S.x - cam); drawFelix(S.x - cam, S.y); ctx.globalAlpha = 1; }   // inside the club he is out of sight

  for (const f of S.fly){
    const sx = f.x - cam, sc = f.sc || 1, half = 6*sc;
    if (f.phase < 2){ ctx.globalAlpha = .45; disc(sx+18, f.y+18, 28, '#ffffff'); ctx.globalAlpha = 1; }
    { const g = ICON[f.icon], k = Math.max(1, Math.round(sc*12/g.length)), hs = g.length*k/2; drawIcon(g, sx+18-hs, f.y+18-hs, k); }
  }
  /* bubble: what, where, when (stays where the box was, independent of the flying item) */
  for (const bb of S.bubbles){
    const a = clamp(Math.min(bb.t/0.15, (BUBBLE_T - bb.t)/0.3), 0, 1), lines = bb.lines, [nx, ny, w, hh] = bubbleRect(bb, cam);
    ctx.globalAlpha = a; panelBox(nx, ny, w, hh, 'rgba(10,12,17,.9)'); r(nx, ny+hh-1, w, 1, 'rgba(255,255,255,.08)');
    lines.forEach((l,i)=> text2(l[0], nx+10, ny+6+i*20, l[1], 1)); ctx.globalAlpha = 1;
  }
  if (S.helpPop){
    const hp = S.helpPop, dur = hp.dur || 3.3, col = hp.col || '#e0708f', a = clamp(Math.min(hp.t/0.2, (dur-hp.t)/0.4), 0, 1);
    const lines = hp.h.lines, [nx, ny, w, hh] = popRect(hp, cam);
    ctx.globalAlpha = a; panelBox(nx, ny, w, hh, 'rgba(10,12,17,.9)'); r(nx, ny+hh-1, w, 1, col);
    lines.forEach((l,i)=> text2(l, nx+10, ny+6+i*20, i===lines.length-1 ? col : i===0 ? '#f4f2ee' : '#b9b2a4', 1)); ctx.globalAlpha = 1;
  }
  for (const p of S.sparks){ ctx.globalAlpha = Math.min(1, p.life*2); r(p.x-cam, p.y, 3, 3, p.col); ctx.globalAlpha = 1; }
  for (const p of S.pops){
    const k = p.t/1.1, sx = p.x - cam, y = p.y - k*56; ctx.globalAlpha = 1-k;
    drawIcon(ICON.star, sx-12, y-12, 2); text2('+1', sx+16, y-8, '#f2c14e'); ctx.globalAlpha = 1;
  }
  if (S.partner && S.partner.t < 2.2){   // a short moment of hearts when she joins
    const fade = Math.min(1, (2.2 - S.partner.t)/0.5);
    for (let i=0;i<5;i++){ const k = (S.partner.t*1.2 + i*0.2) % 1, hx = S.x - cam - 34 + Math.sin(k*7+i)*16 + i*10, hy = GROUND - 90 - k*64;
      ctx.globalAlpha = (1-k)*fade; drawIcon(ICON.heart16, Math.round(hx), Math.round(hy), 1); ctx.globalAlpha = 1; }
  }
  /* ambient particles */
  const pt = (seg.kind==='ground' && THEMES[seg.theme].particles);
  if (pt){
    ctx.globalAlpha = .75;
    for (let i=0;i<pt.n;i++){
      const px = ((hash(i)*W*1.4 + t*pt.vx*(0.6+hash(i+3)) - cam*0.15) % (W+40) + W+40) % (W+40) - 20;
      const py = ((hash(i+9)*GROUND + t*pt.vy*(0.6+hash(i+5))) % GROUND + GROUND) % GROUND;
      r(px, py + Math.sin(t*2+i)*4, 2, 2, pt.col);
    }
    ctx.globalAlpha = 1;
  }
  /* soft vignette */
  const vg = ctx.createRadialGradient(W/2, H*0.55, H*0.45, W/2, H*0.55, W*0.72);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.26)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

  if (S.outlook > 0) outlookCard(S.outlook);
  if (S.warn) missingCard();
  drawHUD(seg, cam);
  present();
}

/* ---------- scenery: every area draws its own full scene; where two areas meet on screen,
   the next one fades in across a soft seam, so walking from one place into the next is continuous ---------- */
const OFF = document.createElement('canvas'); OFF.width = W; OFF.height = H;
const offCtx = OFF.getContext('2d'); offCtx.imageSmoothingEnabled = false;
const sceneKey = s => s.kind==='flight' ? 'flight' : s.theme;
/* areas: consecutive segments with the same scenery merged */
const AREAS = [];
for (const s of LEVEL){ const k = sceneKey(s), last = AREAS[AREAS.length-1]; if (last && last.key === k) last.x1 = s.x1; else AREAS.push({ key:k, x0:s.x0, x1:s.x1 }); }
/* back layer: sky, sun, far and middle distance */
function drawBack(key, cam, t){
  const theme = THEMES[key];
  skyGrad(theme.sky[0], theme.sky[1]);
  if (key==='flight') scaled(0, GROUND, UK, ()=>{ clouds(cam/UK, .25, 'rgba(255,255,255,.85)', 30, 240, 6); hills(cam/UK, .08, '#7fa0b8', 22, 500, 11); });
  else scaled(0, GROUND, UK, ()=>{ theme.far(cam/UK, t); theme.mid(cam/UK, t); });
  r(0, GROUND, W, H-GROUND, theme.ground ? theme.ground.body : '#8fa35a');   // nothing stale below the horizon
}
/* front layer: buildings and props of the area, and the ground */
function drawFront(key, cam, t){
  const theme = THEMES[key];
  if (key==='flight'){
    for (let i=-1;i<W/64+2;i++){ const k = Math.floor(cam*0.5/64)+i, x = i*64 - (cam*0.5)%64; const cols=['#7fa85a','#a8b86a','#8fa35a','#c9b877']; r(x, GROUND-38, 63, H-GROUND+38, cols[Math.abs(k)%4]); r(x, GROUND-38, 63, 1, 'rgba(0,0,0,.15)'); r(x+((k*13)%50), GROUND-38, 1, 90, 'rgba(0,0,0,.12)'); if (k%3===0) for (let yy=GROUND-30; yy<H; yy+=9) r(x+8, yy, 40, 1, 'rgba(0,0,0,.07)'); }
    for (let yy=GROUND-38; yy<H; yy+=16) r(0, yy, W, 1, 'rgba(0,0,0,.05)');
    scaled(0, GROUND, UK, ()=>{ clouds(cam/UK, .55, '#ffffff', 96, 190, 7); clouds(cam/UK, .85, '#ffffff', 134, 160, 8); });
    return;
  }
  let bandSeg = null;
  for (const sg of LEVEL){
    if (sg.kind!=='ground' || sg.theme!==key || sg.x1 < cam - 600 || sg.x0 > cam + W + 600) continue;
    bandSeg = bandSeg || sg;
    for (const [off, fn] of (PROPS[sg.id]||[])){ const sx = sg.x0 + Math.round(off*UK) - cam; if (sx < -360 || sx > W+100) continue; scaled(sx, GROUND, UK, ()=>fn(sx, GROUND, t)); }
  }
  groundBand(bandSeg || LEVEL[0], cam, theme);
}
/* draw into the offscreen canvas and put it on screen with a horizontal alpha mask (list of [x, alpha]) or a flat alpha */
function viaOff(fn, stops, alpha){
  offCtx.clearRect(0, 0, W, H);
  const main = ctx; ctx = offCtx; fn(); ctx = main;
  if (stops){
    offCtx.save(); offCtx.globalCompositeOperation = 'destination-in';
    const g = offCtx.createLinearGradient(0, 0, W, 0);
    stops.forEach(([x, a]) => g.addColorStop(clamp(x/W, 0, 1), `rgba(0,0,0,${a})`));
    offCtx.fillStyle = g; offCtx.fillRect(0, 0, W, H); offCtx.restore();
  }
  if (alpha !== undefined) ctx.globalAlpha = alpha;
  ctx.drawImage(OFF, 0, 0); ctx.globalAlpha = 1;
}
const SKY_BLEND = 1100;   // sky and distance change gradually over this walking distance
const SEAM = 260;         // buildings and ground of the next place fade in over this width
function drawScenery(cam, t){
  /* 1. back: cross-fade by position of the screen centre around each area border */
  const c = cam + W/2;
  let i = AREAS.findIndex(a => c >= a.x0 && c < a.x1); if (i < 0) i = AREAS.length - 1;
  let A = AREAS[i], B = null, k = 0;
  if (i > 0 && c - A.x0 < SKY_BLEND/2){ B = A; A = AREAS[i-1]; k = 0.5 + (c - B.x0)/SKY_BLEND; }
  else if (i < AREAS.length-1 && A.x1 - c < SKY_BLEND/2){ B = AREAS[i+1]; k = 0.5 - (A.x1 - c)/SKY_BLEND; }
  k = k*k*(3-2*k);   // smooth
  drawBack(A.key, cam, t);
  if (B && k > 0.01) viaOff(() => drawBack(B.key, cam, t), null, k);
  /* one sun that moves and changes colour between the two places */
  const sa = THEMES[A.key].sun, sb = B ? THEMES[B.key].sun : null;
  if (sa && (!sb || k < 0.01)) sun(sa.x, sa.y, 12, sa.col, sa.glow);
  else if (sa && sb){ const m = (p, q) => mix(hex2(p), hex2(q), k); sun(Math.round(sa.x + (sb.x-sa.x)*k), Math.round(sa.y + (sb.y-sa.y)*k), 12, m(sa.col, sb.col), m(sa.glow, sb.glow)); }
  else if (sb){ ctx.globalAlpha = k; sun(sb.x, sb.y, 12, sb.col, sb.glow); ctx.globalAlpha = 1; }
  /* 2. front: every area on screen, fading in and out at its borders (the later area lies on top) */
  for (const a of AREAS){
    if (a.x1 + SEAM < cam || a.x0 - SEAM > cam + W) continue;
    const x0 = a.x0 - cam, x1 = a.x1 - cam, fadeIn = x0 > -SEAM && a !== AREAS[0], fadeOut = x1 < W + SEAM && a !== AREAS[AREAS.length-1];
    if (!fadeIn && !fadeOut){ drawFront(a.key, cam, t); continue; }
    const f = x => Math.min(fadeIn ? clamp((x - (x0 - SEAM)) / SEAM, 0, 1) : 1, fadeOut ? clamp(((x1 + SEAM) - x) / SEAM, 0, 1) : 1);
    const pts = [0, x0 - SEAM, x0, x1, x1 + SEAM, W].map(x => clamp(x, 0, W)).sort((p, q) => p - q);
    viaOff(() => drawFront(a.key, cam, t), pts.map(x => [x, f(x)]));
  }
  /* 3. soft veil over the scenery, so boxes, items and the figures stand out */
  const skyA = hex2(THEMES[A.key].sky[1]), skyB = B ? hex2(THEMES[B.key].sky[1]) : skyA;
  ctx.globalAlpha = 0.36; r(0, 0, W, GROUND, mix(skyA, skyB, B ? k : 0)); ctx.globalAlpha = 0.26; r(0, GROUND, W, H-GROUND, '#e9e4da'); ctx.globalAlpha = 1;
}

/* =====================================================================
   8. OVERVIEW (DOM): achievements table + map, and the timeline bar
   ===================================================================== */
const ov = document.getElementById('ov'), ovBody = document.getElementById('ovBody'), ovCount = document.getElementById('ovCount');
const iconURL = {};
function iconDataURL(name){
  if (iconURL[name]) return iconURL[name];
  const grid = ICON[name], gw = grid[0].length, gh = grid.length;
  const c = document.createElement('canvas'); c.width = gw; c.height = gh;
  const g = c.getContext('2d');
  for (let y=0;y<gh;y++) for (let x=0;x<gw;x++){ const col = PAL[grid[y][x]]; if (col){ g.fillStyle = col; g.fillRect(x,y,1,1); } }
  return iconURL[name] = c.toDataURL();
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function flagRow(){
  if (!S.flagsGot.length) return '';
  return `<div class="flags">(${S.flagsGot.map(c=>`<img src="${iconDataURL('flag_'+c)}" alt="${c.toUpperCase()}" title="${c.toUpperCase()}">`).join('')})</div>`;
}
function rowsFor(list){
  return list.map(b => {
    const on = b.hit || b.got;
    if (!on) return `<tr class="locked"><td class="ic"><span class="lk"></span></td><td class="yr">${esc(b.year)}</td><td class="tt" colspan="2">Locked</td></tr>`;
    const ic = `<img src="${iconDataURL(b.icon || 'heart16')}" width="16" height="16" alt="">`;
    const fl = b.flags ? flagRow() : '';
    const role = esc(b.role) + (b.desc ? `<span class="ds">, ${esc(b.desc)}</span>` : '');
    /* organisation in the light font, location in grey after a comma; without an organisation the location takes the light font */
    /* first item (organisation, or the town when there is none) in the light font, everything after the first comma in grey */
    const first = b.org || (b.loc || '').split(', ')[0], rest = b.org ? (b.loc || '') : (b.loc || '').split(', ').slice(1).join(', ');
    const place = `<span class="og">${esc(first)}</span>` + (rest ? `, <span class="lo">${esc(rest)}</span>` : '');
    return `<tr class="${b.major ? 'major ' + b.t : ''}"><td class="ic">${ic}</td><td class="yr">${esc(b.year)}</td><td class="tt">${role}<span class="pl2">${place}${fl}</span></td><td class="pl">${place}${fl}</td></tr>`;
  }).join('');
}
/* one table per overview column, so all rows in a column share the same column positions */
function table(groups){
  let html = `<table><colgroup><col class="c-ic"><col class="c-yr"><col class="c-role"><col class="c-pl"></colgroup>`;
  for (const [cls, title, sections] of groups){
    html += `<tbody><tr><th class="${cls}" colspan="4">${title}</th></tr>`;
    for (const [sub, list] of sections){
      if (!list.length) continue;
      if (sub) html += `<tr><td class="sub" colspan="4">${sub}</td></tr>`;
      html += rowsFor(list);
    }
    html += `<tr class="gap"><td colspan="4"></td></tr></tbody>`;
  }
  return html + '</table>';
}
const yStart = b => parseInt(b.year, 10) || 0;
function refreshPanel(){
  const ns = SECRETS(); ovCount.textContent = `${S.stars} / ${TOTAL()} achievements` + (ns ? ` + ${ns} secret${ns > 1 ? 's' : ''}` : '');
  if (!panelOpen) return;
  const by = (t,k) => BOXES.filter(b=>b.t===t && (!k || b.k===k));
  const degHon = BOXES.filter(b=>b.t==='edu' && (b.k==='degree' || b.k==='honour')).map((b,i)=>[b,i])
    .sort((a,c)=> yStart(a[0]) - yStart(c[0]) || a[1] - c[1]).map(x=>x[0]);
  ovBody.innerHTML = `<div class="cols">
    <div class="col">${table([['life','Life',[['',by('life')]]], ['edu','Education',[['Timeline',by('edu','station')],['Degrees and honours',degHon]]]])}</div>
    <div class="col">${table([['work','Work',[['Positions',by('work','station')],['Expertise',[ROBOT]]]], ['vol','Volunteering',[['',HELPS]]]])}</div></div>`;
}
function openPanel(open){
  panelOpen = open; ov.classList.toggle('open', open);
  if (open) refreshPanel();
}
document.getElementById('ovClose').onclick = ()=>openPanel(false);
document.getElementById('ovClear').onclick = ()=>{ reset(); hideLinks(); updateTimeline(); refreshPanel(); };
document.getElementById('ovAll').onclick = ()=>{
  for (const f of S.fly) if (!f.done){ f.done = true; f.arrive(); }
  for (const b of BOXES){ if (b.hit) continue; b.hit = true; b.open = 1; S.stars++; if (b.wear) wear(b.wear); }
  for (const fl of MCK_FLAGS){ if (!fl.got){ fl.got = true; S.flagsGot.push(fl.c); } }
  for (const h of HELPS){ if (!h.got){ h.got = true; S.stars++; } }
  if (!ROBOT.got){ ROBOT.got = true; ROBOT.state = 'tamed'; ROBOT.vx = 0; ROBOT.tamedAt = -10; ROBOT.x = S.x - 40; S.stars++; }
  /* the secrets only if their codes were typed */
  if (AI.on) for (const u of UPGRADES){ if (!u.got){ u.got = true; ROBOT[u.up] = true; } }
  if (GYM.on && !GYM.done){ GYM.done = true; GYM.phase = null; S.buff = true; }
  if (GF.on && !S.partner) S.partner = { x:S.x - 34, t:10 };
  S.kid = 0; S.visible = true; S.fly = []; S.allUnlocked = true; userGesture(); sfx('flag'); refreshPanel();
};

/* timeline under the game */
const tl = document.getElementById('tl'); let tlMark;
(function buildTimeline(){
  const seen = new Set();
  for (const s of LEVEL){
    if (s.kind!=='ground' || !s.years) continue;
    const y = s.years.split('-')[0]; if (seen.has(y)) continue; seen.add(y);
    const pct = s.x0 / WORLD_END * 100;
    tl.insertAdjacentHTML('beforeend', `<div class="tick" style="left:${pct}%"></div><div class="lab${seen.size===1?' first':''}" data-x0="${s.x0}" data-x1="${s.x1}" style="left:${pct}%">${y}</div>`);
  }
  tl.insertAdjacentHTML('beforeend', `<div class="tick" style="left:100%"></div><div class="lab next" style="left:100%">NEXT</div><div class="mark"></div>`);
  tlMark = tl.querySelector('.mark');
})();
function updateTimeline(){
  tlMark.style.left = (S.x / WORLD_END * 100) + '%';
  const labs = tl.querySelectorAll('.lab'); let onIdx = -1;
  labs.forEach((l,i)=>{ if (S.x >= +l.dataset.x0) onIdx = i; });
  labs.forEach((l,i)=> l.classList.toggle('on', i===onIdx));
  const nx = tl.querySelector('.lab.next'); if (nx) nx.classList.toggle('on', S.ended);
}
/* hide year labels that would overlap on narrow screens */
function layoutTimeline(){
  let lastRight = -1e9, lastVis = null;
  const next = tl.querySelector('.lab.next'), nb = next ? next.getBoundingClientRect() : null;
  tl.querySelectorAll('.lab:not(.next)').forEach(l => {
    l.style.visibility = 'visible';
    const b = l.getBoundingClientRect();
    if (b.left < lastRight + 6 || (nb && b.right > nb.left - 6)) l.style.visibility = 'hidden'; else { lastRight = b.right; lastVis = l; }
  });
}
layoutTimeline(); addEventListener('resize', layoutTimeline); addEventListener('orientationchange', ()=>setTimeout(layoutTimeline, 200));
function onSegment(seg){}

/* =====================================================================
   9. SOUND  (all synthesised, no files)
   ===================================================================== */
let AC = null, musicOn = false, nextNote = 0, stepIdx = 0;
const RECORD = new URLSearchParams(location.search).has('record');
function ac(){ if (!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function tone(freq, dur, type='square', vol=0.05, when=0){
  const a = ac(); if (!a || muted || RECORD) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.value = freq;
  const t0 = a.currentTime + when;
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0+dur+0.02);
}
function sfx(k){
  if (k==='jump') tone(440,.09);
  else if (k==='hit'){ tone(660,.07); tone(990,.1,'square',.05,.07); }
  else if (k==='star'){ tone(1046,.08,'triangle',.07); tone(1318,.1,'triangle',.07,.08); tone(1568,.16,'triangle',.07,.16); }
  else if (k==='wear'){ tone(523,.06,'triangle',.06); tone(784,.12,'triangle',.06,.06); }
  else if (k==='flag'){ [523,659,784,1046].forEach((f,i)=>tone(f,.18,'square',.05,i*.12)); }
  else if (k==='buzz'){ tone(150,.16,'sawtooth',.04); tone(110,.14,'square',.03,.05); }
  else if (k==='clank'){ tone(1760,.05,'square',.03); tone(880,.14,'triangle',.05,.03); }
}
const N = n => 440*Math.pow(2,(n-69)/12);
const LEAD = [72,76,79,76, 69,72,76,72, 65,69,72,69, 67,71,74,71, 72,76,79,84, 83,79,76,74, 77,76,74,72, 74,67,0,0];
const BASS = [48,0,55,0, 45,0,52,0, 41,0,48,0, 43,0,50,0, 48,0,55,0, 47,0,55,0, 41,0,48,0, 43,0,50,0];
function music(){
  const a = ac(); if (!a || !musicOn || muted || RECORD || paused || panelOpen || !S.started) return;
  const spb = 60/132/2;
  while (nextNote < a.currentTime + 0.25){
    const i = stepIdx % LEAD.length;
    if (LEAD[i]) tone(N(LEAD[i]), spb*0.9, 'square', 0.028, nextNote - a.currentTime);
    if (BASS[i]) tone(N(BASS[i]), spb*1.8, 'triangle', 0.05, nextNote - a.currentTime);
    nextNote += spb; stepIdx++;
  }
}
function userGesture(){ const a = ac(); if (a && a.state==='suspended') a.resume(); if (!musicOn){ musicOn = true; nextNote = (a ? a.currentTime : 0) + 0.1; } }

/* =====================================================================
   10. INPUT + LOOP
   ===================================================================== */
let typed = '';   // the last letters typed, for the secret codes
let sunTaps = 0, sunTapAt = 0;
function allSecrets(){
  const fresh = ['gym', 'gf', 'llm'].filter(w => secretFound(w, true));
  if (!fresh.length) return;
  S.toast = { lines:['ALL SECRETS UNLOCKED', 'GYM, GADGETS AND PARTNER'], t:0, dur:4.6, col:'#f2c14e' }; sfx('flag');
}
function secretFound(which, quiet){
  if (which === 'gym'){
    if (GYM.on) return false; GYM.on = true;
    S.toast = { lines:['SECRET UNLOCKED', 'FITNESS FIRST OPENS IN MUNICH'], t:0, dur:4.6, col:GYM.col };
  } else if (which === 'gf'){
    if (GF.on) return false; GF.on = true;
    S.toast = { lines:['SECRET UNLOCKED', S.started && S.x > PARTNER_X ? 'YOUR PARTNER JOINS YOU NOW' : 'YOUR PARTNER JOINS IN LONDON'], t:0, dur:4.6, col:GF.col };
  } else if (which === 'llm'){
    if (AI.on) return false; AI.on = true;
    S.toast = { lines:['SECRET UNLOCKED', 'TWO GADGETS FOR THE ROBOT IN MUNICH'], t:0, dur:4.6, col:AI.col };
  }
  if (quiet){ S.toast = null; return true; }
  sfx('flag'); return true;
}
addEventListener('keydown', e=>{
  userGesture();
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  let secret = false;                                                                  // type G Y M (any case, any keyboard layout)
  if (e.key && e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey){
    typed = (typed + e.key.toLowerCase()).slice(-3);
    if (typed === 'gym'){ secret = true; secretFound('gym'); } else if (typed.endsWith('gf')) secretFound('gf'); else if (typed === 'llm'){ secret = true; secretFound('llm'); }
  }
  if (panelOpen && e.code!=='KeyA' && e.code!=='KeyC' && e.code!=='Escape'){ keys[e.code] = false; return; }
  if (['ArrowLeft','ArrowRight','ArrowUp','KeyD','KeyW'].includes(e.code)) startGame(false);
  if (e.code==='Enter') startGame(true);
  if (e.code==='Space' || e.code==='KeyP'){ if (!S.started) startGame(false); else paused = !paused; }
  if (e.code==='KeyR'){ reset(); openPanel(false); paused = false; hideLinks(); }
  if (e.code==='KeyM' && !secret) muted = !muted;                                     // the M of gym or llm does not touch the sound
  if (e.code==='KeyA' || e.code==='KeyC') openPanel(!panelOpen);
  if (e.code==='Escape') openPanel(false);
});
addEventListener('keyup', e=>{ keys[e.code] = false; });
cv.addEventListener('click', e=>{
  userGesture();
  const rect = cv.getBoundingClientRect(), x = (e.clientX-rect.left)/rect.width*W, y = (e.clientY-rect.top)/rect.height*H;
  const b = S.btnRect;
  if (b && x>=b.x-4 && x<=b.x+b.w+4 && y>=b.y-4 && y<=b.y+b.h+6){ openPanel(!panelOpen); return; }   // the star opens the menu, also on the start screen
  if (Math.hypot(x - SUNPOS.x, y - SUNPOS.y) < 40){                                                  // five quick taps on the sun: all secrets (for phones)
    const now = performance.now(); sunTaps = now - sunTapAt < 1500 ? sunTaps + 1 : 1; sunTapAt = now;
    if (sunTaps >= 5){ sunTaps = 0; allSecrets(); }
    return;
  }
  if (!S.started){ startGame(false); return; }
});
function bindTouch(id, codes){
  const el = document.getElementById(id); if (!el) return;
  codes = [].concat(codes);
  const on = e=>{ e.preventDefault(); userGesture(); codes.forEach(c=>keys[c] = true); startGame(false); };
  const off = e=>{ e.preventDefault(); codes.forEach(c=>keys[c] = false); };
  el.addEventListener('pointerdown', on); el.addEventListener('pointerup', off); el.addEventListener('pointercancel', off); el.addEventListener('pointerleave', off);
}
bindTouch('tL','ArrowLeft'); bindTouch('tR','ArrowRight'); bindTouch('tJ','ArrowUp'); bindTouch('tFL',['ArrowLeft','ShiftLeft']); bindTouch('tFR',['ArrowRight','ShiftLeft']);   // one button each, no two-finger combo
document.getElementById('touch').addEventListener('dblclick', e=>e.preventDefault());
['gesturestart','gesturechange'].forEach(ev=>document.addEventListener(ev, e=>e.preventDefault(), {passive:false}));   // no pinch zoom while playing (iOS)
const tC = document.getElementById('tC'); if (tC) tC.addEventListener('click', ()=>{ userGesture(); openPanel(!panelOpen); });

const links = document.createElement('div');
links.id = 'endlinks';
links.innerHTML = '<a href="https://scholar.google.com/citations?user=tX8UpusAAAAJ&hl=en" target="_blank" rel="noopener" style="color:#f2c14e;border-bottom:1px solid #c99423">Google Scholar</a>' +
                  '<a href="https://felixkrones.de/CV_Felix_Krones.pdf" target="_blank" rel="noopener" style="color:#f4f2ee;border-bottom:1px solid #8b8578">CV (PDF)</a>' +
                  '<a href="https://www.linkedin.com/in/felixkrones" target="_blank" rel="noopener" style="color:#9fc3ea;border-bottom:1px solid #3d6fb4">LinkedIn</a>';
document.getElementById('tl').after(links);
/* at the end the links take the place of the key hints, so the page keeps its height and nothing scrolls */
const hud = document.getElementById('hud');
function showLinks(){ links.style.display = 'flex'; hud.style.display = 'none'; }
function hideLinks(){ links.style.display = 'none'; hud.style.display = ''; }

const DT = 1/60;
if (!RECORD){
  let last = performance.now();
  (function frame(now){
    const dt = Math.min(0.05, (now-last)/1000); last = now;
    if (!paused && !panelOpen) step(dt);
    if (S.toast){ S.toast.t += dt; if (S.toast.t > S.toast.dur) S.toast = null; }
    render(); music(); updateTimeline();
    if (S.ended && S.endT > 1.5) showLinks();
    requestAnimationFrame(frame);
  })(performance.now());
} else render();

window.__S = () => ({ x:S.x, seg:segAt(S.x).id, worn:S.worn, hits:BOXES.filter(b=>b.hit).length, stars:S.stars, kid:S.kid });
window.GAME = {
  reset, step, render,
  seek(sec){ reset(); openPanel(false); startGame(true); const n = Math.round(sec/DT); for (let i=0;i<n;i++) step(DT); render(); updateTimeline(); },
  advance(n=1){ if (!S.started) startGame(true); for (let i=0;i<n;i++) step(DT); render(); updateTimeline(); },
  get time(){ return S.t; }, get x(){ return S.x; }, get done(){ return S.ended && S.endT > 8; },
  secret(which='gym'){ secretFound(which); }, all(){ allSecrets(); }, get gym(){ return { on:GYM.on, phase:GYM.phase, done:GYM.done, buff:S.buff, gf:GF.on, partner:!!S.partner, ai:AI.on, ups:UPGRADES.filter(u=>u.got).length, secrets:SECRETS() }; }
};
